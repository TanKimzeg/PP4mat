name: "Feature request / 功能建议"
description: "提出一个改进建议或新功能需求"
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "感谢建议！简单描述需求与场景即可。"

  - type: textarea
    id: request
    attributes:
      label: 需求描述
      description: 你希望增加/改进什么？为什么？
      placeholder: 例如：希望报告支持按章节折叠，方便快速定位问题
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 截图、示例、参考链接等（注意脱敏）
    validations:
      required: false
